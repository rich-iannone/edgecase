name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Test builds skip the release profile's fat LTO and single codegen unit, which only
  # matter for the published wheels and multiply the compile time
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Ruff
        run: |
          python -m pip install ruff==0.17.3
          ruff check .

      - name: Rustfmt
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --all-targets --features temporal,weighted,parallel -- -D warnings

  rust-test:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      # The Rust unit tests embed a Python interpreter (pyo3 `auto-initialize`), so the test
      # binary links the libpython of the interpreter pyo3 finds on PATH
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run Rust tests
        run: cargo test --all-targets --features temporal,weighted,parallel

  msrv:
    name: Rust 1.82 (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Keep in step with `rust-version` in Cargo.toml
      - uses: dtolnay/rust-toolchain@1.82

      - uses: Swatinem/rust-cache@v2

      - name: Check with the lockfile
        run: cargo check --all-targets --locked --features temporal,weighted,parallel

  python-test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Test the built wheel rather than an editable install, so a file missing from the
      # package (a bundled dataset, a static asset) fails here and not for users
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist

      - name: Install the wheel and the test dependencies
        run: python -m pip install "$(ls dist/*.whl)[test]"

      - name: Run the tests
        run: python -m pytest -q -n auto tests --ignore=tests/benchmarks -p no:cacheprovider

      - name: Smoke-test the benchmarks
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m pytest -q tests/benchmarks --benchmark-disable -p no:cacheprovider

  minimum-deps:
    name: Minimum dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip maturin uv
          maturin build --release --out dist

      # Resolve EdgeCase's own requirements to the lowest versions its pyproject.toml allows
      # (read from pyproject.toml, since a wheel's requirements would count as indirect and
      # escape `lowest-direct`), then add the test tools on top without upgrading anything
      - name: Install the lowest allowed dependencies
        run: |
          uv pip install --system --resolution lowest-direct -r pyproject.toml
          uv pip install --system --no-deps dist/*.whl
          uv pip install --system pytest pytest-xdist hypothesis networkx igraph numpy scipy pandas ipython
          python -m pip list

      - name: Run the tests
        run: python -m pytest -q -n auto tests --ignore=tests/benchmarks -p no:cacheprovider

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the sdist
        run: |
          python -m pip install --upgrade pip maturin twine
          maturin sdist --out dist
          twine check --strict dist/*

      # Build and install from the sdist alone, away from the checkout, to catch files the
      # sdist leaves out
      - name: Install from the sdist
        run: |
          python -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          python -c "import edgecase as ec; g = ec.karate_club(); print(g.count_nodes(), g.count_edges())"
