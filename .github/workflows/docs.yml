name: CI Docs

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A newer push to the same PR supersedes its docs build; builds on main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-docs:
    name: "Build Docs"
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      # The docs only need a working extension module, not the published wheels' fat LTO
      # and single codegen unit, which multiply the compile time
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history for accurate page timestamps

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The editable install compiles the Rust extension
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `all` brings in NetworkX, igraph, SciPy and the rest that the user guide runs
      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install git+https://github.com/posit-dev/great-docs.git

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Render the pages with several Quarto processes at once. Every page that runs code gets a
      # fresh Jupyter kernel, whose TCP ports jupyter_client picks by binding to port 0 and
      # releasing the socket, so two processes now and then hand their kernels the same port and
      # one dies on startup. A build that fails that way runs again in one process, which starts
      # one kernel at a time (a failed build saves no freeze cache, so it starts from scratch).
      # `shell: bash` adds pipefail, without which the `if` would test tee's exit status and a
      # failed build would pass
      - name: Build docs
        shell: bash
        run: |
          if ! great-docs build --jobs auto 2>&1 | tee "$RUNNER_TEMP/build.log"; then
            grep -q "Address already in use" "$RUNNER_TEMP/build.log" || exit 1
            echo "::warning::Two Jupyter kernels were given the same port; building again in one process"
            great-docs build
          fi

      - name: Save docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site
          include-hidden-files: true

      - name: How to preview this build locally
        if: github.event_name == 'pull_request'
        run: great-docs ci notice --run ${{ github.run_id }} --pr ${{ github.event.number }}

      - name: Upload build timings
        uses: actions/upload-artifact@v7
        with:
          name: build-timings
          path: great-docs/_site/build-timings.json

  publish-docs:
    name: "Publish Docs"
    runs-on: ubuntu-latest
    needs: "build-docs"
    if: github.ref == 'refs/heads/main'
    # One deployment at a time, and never cancel one partway through
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: great-docs/_site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  preview-docs:
    name: "Preview Docs"
    runs-on: ubuntu-latest
    needs: "build-docs"
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      # Post (and keep updated) a sticky PR comment with the local-preview
      # command, pinned to this run so it reproduces the build under review.
      # Runs the released great-docs via pipx (no install step needed); kept as
      # its own minimal job so the docs build never holds a pull-requests:write
      # token. continue-on-error so fork PRs (read-only token) don't fail the run.
      - name: Post preview instructions to the PR
        continue-on-error: true
        run: pipx run great-docs ci pr-comment --run ${{ github.run_id }} --pr ${{ github.event.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
