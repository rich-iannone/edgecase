[package]
name = "edgecase-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Rich Iannone <riannone@me.com>"]
license = "MIT"
description = "High-performance Rust core for edgecase graph library"
repository = "https://github.com/rich-iannone/edgecase"
keywords = ["graph", "network", "polars", "python"]
categories = ["algorithms", "data-structures", "science"]

[lib]
name = "edgecase_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py39"] }
rayon = "1.10"  # Parallel iterators
petgraph = "0.8"  # Graph data structures
ahash = "0.8"  # Fast hashing
rustc-hash = "2.1"  # Fast hashing for graphs
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
itertools = "0.14"
rand = "0.8"  # Random number generation
rand_chacha = "0.3"  # ChaCha RNG for reproducibility
nalgebra = "0.33"  # Linear algebra with eigensolvers

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"  # Property-based testing
quickcheck = "1.0"
quickcheck_macros = "1.0"
rstest = "0.18"  # Parameterized tests

[features]
default = ["temporal", "weighted"]
extension-module = ["pyo3/extension-module"]
temporal = []  # Temporal graph analysis
weighted = []  # Weighted graph support
parallel = []  # Parallel computation

[[bench]]
name = "graph_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"  # Remove panic unwinding code for better performance

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1  # Faster test compilation
