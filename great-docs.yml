# Great Docs Configuration
# See https://posit-dev.github.io/great-docs/user-guide/

# Module Name
# -----------
# Explicit importable module name (use when it differs from project name)
module: edgecase

# Display Name
# ------------
# Custom display name for the package in the site navbar/title
display_name: Edgecase

# Docstring Parser
# ----------------
# The docstring format used in your package (numpy, google, or sphinx)
parser: numpy

# Dynamic Introspection
# ---------------------
# Use runtime introspection for more accurate documentation (default: true)
# Set to false if your package has cyclic alias issues (e.g., PyO3/Rust bindings)
dynamic: false

# Authors
# -------
authors:
  - name: Rich Iannone
    role: Maintainer
    affiliation: Posit, PBC
    email: riannone@me.com
    github: rich-iannone
    orcid: 0000-0003-3925-190X

# Site Settings
# -------------
# Page metadata display options
site:
  show_dates: true
  show_author: true

# Source Link Configuration
# -------------------------
# Configure links to source code on GitHub
source:
  enabled: true
  branch: main
  placement: usage

# Sidebar Filter
# --------------
# Enable filtering in the API reference sidebar
sidebar_filter:
  enabled: true
  min_items: 15

# Changelog
# ---------
# Auto-generate changelog from GitHub Releases
changelog:
  enabled: true
  max_releases: 30

# Exclusions
# ----------
# Items to exclude from API documentation (handles problematic re-exports/aliases)
exclude:
  - COLOR_PALETTES
  - _HAS_NETWORKX
  - _HAS_IGRAPH
  - Node
  - Edge
  - AdaStar
  - GraphWidget
  - graph.Node
  - graph.Edge
  - graph.AdaStar

# API Reference Structure
# -----------------------
# The reference section uses the dict form to set a page title and description.
# Sections organize the API by functionality area.
# - Use 'members: false' to exclude class methods from documentation
# - Add 'desc:' to sections for descriptions shown on the index page

reference:
  title: API Reference
  desc: >
    Complete API documentation for Edgecase. The Graph class is the core object
    for creating and analyzing network structures, with methods organized by
    functionality including graph construction, traversal, centrality measures,
    community detection, and interoperability with NetworkX and igraph.
