# pytest.ini
[pytest]

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Test paths
testpaths = tests

# Output options
console_output_style = progress
addopts = 
    # Verbose output
    -v
    # Show local variables in tracebacks
    --showlocals
    # Show summary of all test outcomes
    -ra
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Show slowest N tests
    --durations=10
    # Coverage with line details
    --cov=python/edgecase
    --cov-report=term-missing
    --cov-report=html
    # Fail on warnings
    # --strict-config

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    stress: marks stress tests (large graphs, high memory)
    benchmark: marks benchmark tests
    unit: marks unit tests
    integration: marks integration tests
    property: marks property-based tests

# Coverage options (when using pytest-cov)
# Run with: pytest --cov=edgecase --cov-report=html

# Timeout (requires pytest-timeout)
# timeout = 300

# Filterwarnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# Log output
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Benchmark options (when using pytest-benchmark)
# benchmark-min-rounds = 5
# benchmark-max-time = 1.0
